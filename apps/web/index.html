<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>枪战突击 · COMBAT STRIKE</title>
    <meta name="description" content="单人 PvE 战术射击战役：50 关、10 章节、44 件装备。" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%2300e5ff' stroke-width='2'/%3E%3Cpath d='M16 3v7M16 22v7M3 16h7M22 16h7' stroke='%2300e5ff' stroke-width='2'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <!-- ============================ 屏幕层 ============================ -->
      <div id="screen-root" aria-live="polite"></div>

      <!-- ============================ 游戏层 ============================ -->
      <div id="game-root" class="is-hidden">
        <div id="canvas-host"></div>

        <div id="hud" aria-hidden="false">
          <div class="hud__tl">
            <div class="bar bar--health">
              <span class="bar__label">生命</span>
              <div class="bar__track"><div id="health-fill" class="bar__fill"></div></div>
              <span id="health-value" class="bar__value">0</span>
            </div>
            <div class="bar bar--energy">
              <span class="bar__label">能量</span>
              <div class="bar__track"><div id="energy-fill" class="bar__fill"></div></div>
              <span id="energy-value" class="bar__value">0</span>
            </div>
            <div class="bar bar--shield is-hidden" id="shield-bar">
              <span class="bar__label">护盾</span>
              <div class="bar__track"><div id="shield-fill" class="bar__fill"></div></div>
              <span id="shield-value" class="bar__value">0</span>
            </div>
          </div>

          <div class="hud__tc">
            <div id="wave-banner" class="wave-banner is-hidden">
              <div id="wave-banner-title" class="wave-banner__title">第一波</div>
              <div id="wave-banner-sub" class="wave-banner__sub"></div>
            </div>
            <div id="boss-warning" class="boss-warning is-hidden"></div>
          </div>

          <div class="hud__tr">
            <div id="boss-bar" class="bar bar--boss is-hidden">
              <span id="boss-name" class="bar__label">BOSS</span>
              <div class="bar__track"><div id="boss-fill" class="bar__fill"></div></div>
              <span id="boss-value" class="bar__value">0</span>
            </div>
            <div id="score-value" class="hud__score">0</div>
          </div>

          <div class="hud__bl">
            <div class="weapon-slots" id="weapon-slots"></div>
          </div>

          <div class="hud__br">
            <div id="current-weapon-name" class="weapon-name">雷霆之怒</div>
            <div class="ammo">
              <span id="ammo-current" class="ammo__current">150</span>
              <span class="ammo__sep">/</span>
              <span id="ammo-reserve" class="ammo__reserve">1500</span>
            </div>
            <div id="skill-icons" class="skill-icons"></div>
          </div>

          <div id="crosshair" class="crosshair">
            <span class="crosshair__line crosshair__line--t"></span>
            <span class="crosshair__line crosshair__line--b"></span>
            <span class="crosshair__line crosshair__line--l"></span>
            <span class="crosshair__line crosshair__line--r"></span>
            <span class="crosshair__dot"></span>
          </div>
          <div id="damage-numbers" class="damage-numbers"></div>
          <div id="fps-counter" class="fps-counter is-hidden">60 FPS</div>
        </div>

        <div id="pause-overlay" class="overlay is-hidden">
          <div class="modal">
            <div class="modal__head"><h2>暂停</h2></div>
            <div class="modal__body">
              <button id="pause-resume" class="btn btn--primary" type="button">继续战斗</button>
              <button id="pause-restart" class="btn" type="button">重新开始本关</button>
              <button id="pause-settings" class="btn" type="button">设置</button>
              <button id="pause-home" class="btn" type="button">返回主菜单</button>
            </div>
          </div>
        </div>

        <div id="result-overlay" class="overlay is-hidden">
          <div class="modal">
            <div class="modal__head"><h2 id="result-title" class="result__title">任务完成</h2></div>
            <div class="modal__body">
              <div class="result__score" id="result-score">0</div>
              <div class="result__stats" id="result-stats"></div>
              <div class="result__actions">
                <button id="result-next" class="btn btn--primary" type="button">进入下一关</button>
                <button id="result-retry" class="btn" type="button">再战一次</button>
                <button id="result-home" class="btn" type="button">返回主菜单</button>
              </div>
            </div>
          </div>
        </div>

        <div id="loading" class="loading is-hidden">
          <div class="loading__label" id="loading-label">载入中</div>
          <div class="loading__bar"><div id="loading-fill"></div></div>
          <div class="loading__tip" id="loading-tip"></div>
        </div>
      </div>

      <!-- ============================ 全局层 ============================ -->
      <div id="toast-host" class="toast-host" aria-live="polite"></div>

      <div id="settings-modal" class="overlay is-hidden">
        <div class="modal modal--wide">
          <div class="modal__head">
            <h2>设置</h2>
            <button class="modal__close" id="settings-close" type="button" aria-label="关闭">×</button>
          </div>
          <div class="modal__body" id="settings-body"></div>
        </div>
      </div>

      <div id="legacy-import-modal" class="overlay is-hidden">
        <div class="modal modal--wide">
          <div class="modal__head">
            <h2>导入旧版存档</h2>
            <button class="modal__close" id="legacy-import-close" type="button" aria-label="关闭">×</button>
          </div>
          <div class="modal__body" id="legacy-import-body"></div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

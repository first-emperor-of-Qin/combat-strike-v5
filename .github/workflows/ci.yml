name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: 校验与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 构建
        run: npm run build

      - name: 内容包校验（50 关 / 44 件装备 / 10 档难度）
        run: npm run content:verify

      - name: 单元与回归测试
        run: npm test

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  e2e:
    name: 端到端流程
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: 安装 Playwright 浏览器
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: 菜单 → 战斗 → 结算 → 存档
        working-directory: apps/web
        run: npx playwright test

      - name: 上传失败报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  api-integration:
    name: API 与数据库集成
    runs-on: ubuntu-latest
    needs: validate
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: combat
          POSTGRES_PASSWORD: combat
          POSTGRES_DB: combat_strike
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U combat -d combat_strike"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: 数据库迁移
        working-directory: apps/api
        env:
          DATABASE_URL: postgres://combat:combat@127.0.0.1:5432/combat_strike
          SESSION_SECRET: ci-session-secret-ci-session-secret
        run: npm run db:migrate

      - name: 启动 API
        working-directory: apps/api
        env:
          DATABASE_URL: postgres://combat:combat@127.0.0.1:5432/combat_strike
          SESSION_SECRET: ci-session-secret-ci-session-secret
          PORT: 3000
        run: node dist/server.js &

      - name: 健康检查
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health; then exit 0; fi
            sleep 1
          done
          echo "API 未在 30 秒内就绪" >&2
          exit 1

  image:
    name: 容器镜像
    runs-on: ubuntu-latest
    needs: [validate, api-integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: combat-strike:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
